<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App-Icon von Localist: gestapelte Seiten mit einem "L" auf blauem Grund.
       Daraus erzeugt `npx tauri icon app-icon.svg` alle Größen in src-tauri/icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <!-- hintere Seite -->
  <rect x="330" y="214" width="420" height="540" rx="44" fill="#ffffff" opacity="0.35" transform="rotate(8 540 484)"/>
  <!-- vordere Seite mit Eselsohr -->
  <path d="M310 250 h300 l120 120 v370 a44 44 0 0 1 -44 44 h-376 a44 44 0 0 1 -44 -44 v-446 a44 44 0 0 1 44 -44 z" fill="url(#page)"/>
  <path d="M610 250 v76 a44 44 0 0 0 44 44 h76 z" fill="#c7d2fe"/>
  <!-- "L" -->
  <path d="M390 380 h76 v260 h170 v70 h-246 z" fill="#4f46e5"/>
</svg>
