[package]
name = "localist"
version = "2.3.2"
description = "Localist – Notizen und Projekte als Markdown-Dateien"
authors = ["Localist"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-notification = "2"


# Android hat keinen System-Papierkorb; dort verschiebt die App gelöschte Einträge in .localist/Papierkorb.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.9"

# Updates über GitHub Releases und Neustart danach gibt es nur am PC.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
