# Release von Localist für Windows (Etappe 21) und Android (seit Version 2.3.1).
# Läuft, sobald ein Versions-Tag wie v2.2.1 gepusht wird (siehe scripts/version.mjs und ANLEITUNG-RELEASE.md).
# Erst laufen alle Tests; schlägt einer fehl, entsteht kein Release. Danach baut tauri-action den Installer,
# signiert ihn für den Updater und lädt Installer, .sig-Datei und latest.json in ein GitHub-Release hoch.
# Danach baut der Job „android“ die signierte APK und hängt sie an dasselbe Release (ANLEITUNG-RELEASE.md, Schritt 7).
# Von Hand gestartet („Run workflow“ mit einem vorhandenen Tag) baut er nur die APK für dieses Release nach.
#
# Release-Ziel: Sind die Repository-Variablen RELEASE_OWNER und RELEASE_REPO gesetzt, geht das Release in jenes
# (öffentliche) Repository, mit dem Token aus dem Secret RELEASES_TOKEN. Sonst geht es in dieses Repository.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Versions-Tag, dessen Release eine APK bekommen soll (z. B. v2.3.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows-Installer bauen und veröffentlichen
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    steps:
      # Git für Windows wandelt beim Auschecken sonst alle Zeilenenden in CRLF um. Tests und Beispiel-Vault erwarten
      # LF, so wie die Dateien im Repository stehen.
      - name: Zeilenenden wie im Repository (LF)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build zwischenspeichern
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Pakete installieren
        run: npm ci

      - name: Tests der Oberfläche
        run: npm test

      - name: Tests des Rust-Teils
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Release in dieses Repository
        if: ${{ vars.RELEASE_OWNER == '' || vars.RELEASE_REPO == '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: "Localist v__VERSION__"
          releaseBody: "Neue Version von Localist. Unter Windows und Android: in Localist unter Einstellungen → „Über Localist“ → „Nach Updates suchen“, oder unten den Installer (Windows) bzw. die APK (Android) herunterladen."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # latest.json zeigt unter "windows-x86_64" auf den NSIS-Installer (Localist_X.Y.Z_x64-setup.exe).
          updaterJsonPreferNsis: true

      - name: Release in das Repository aus RELEASE_OWNER/RELEASE_REPO
        if: ${{ vars.RELEASE_OWNER != '' && vars.RELEASE_REPO != '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ vars.RELEASE_OWNER }}
          repo: ${{ vars.RELEASE_REPO }}
          # Im Release-Repository gibt es diesen Commit nicht; der Tag entsteht dort auf dessen Branch main.
          releaseCommitish: main
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: "Localist v__VERSION__"
          releaseBody: "Neue Version von Localist. Unter Windows und Android: in Localist unter Einstellungen → „Über Localist“ → „Nach Updates suchen“, oder unten den Installer (Windows) bzw. die APK (Android) herunterladen."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # latest.json zeigt unter "windows-x86_64" auf den NSIS-Installer (Localist_X.Y.Z_x64-setup.exe).
          updaterJsonPreferNsis: true

  android:
    name: Android-APK bauen und anhängen
    # Erst wenn das Release steht; der Job oben legt es an und lädt latest.json hoch. Von Hand gestartet gibt es
    # den Job oben nicht, das Release steht dann schon.
    needs: release
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() || needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Dasselbe Ziel wie oben: dieses Repository oder RELEASE_OWNER/RELEASE_REPO.
      GH_REPO: ${{ vars.RELEASE_OWNER != '' && vars.RELEASE_REPO != '' && format('{0}/{1}', vars.RELEASE_OWNER, vars.RELEASE_REPO) || github.repository }}
      GH_TOKEN: ${{ vars.RELEASE_OWNER != '' && vars.RELEASE_REPO != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Schlüssel für die APK vorhanden?
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORT" ]; then
            echo "::error::Die Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORD fehlen (ANLEITUNG-RELEASE.md, Schritt 7). Das Release hat deshalb keine APK."
            exit 1
          fi

      - name: Code holen
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ohne „packages“ will die Aktion das Paket „tools“ installieren, das es nicht mehr gibt (Lauf zu v2.3.1).
      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: NDK installieren
        run: sdkmanager --install "ndk;$NDK_VERSION"

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust-Build zwischenspeichern
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Pakete installieren
        run: npm ci

      # Der Schlüssel liegt nur für diesen Lauf auf dem Rechner von GitHub, nie im Repository.
      - name: Schlüssel aus den Secrets schreiben
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/localist-android.jks"
          printf 'storeFile=%s\nkeyAlias=localist\npassword=%s\n' "$RUNNER_TEMP/localist-android.jks" "$PASSWORT" > src-tauri/gen/android/keystore.properties

      # Nur für Handys mit ARM-Prozessor (64 Bit), das sind praktisch alle aktuellen Android-Handys.
      - name: APK bauen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64

      - name: Signatur prüfen und APK an das Release hängen
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DATEI="Localist_${VERSION}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$DATEI"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$DATEI" | grep "SHA-256"
          gh release upload "v${VERSION}" "$DATEI" --clobber
